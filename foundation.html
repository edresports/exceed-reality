        }

        .nav-link:hover {

        }

        .hero {

            text-transform: uppercase;
            color: #888;
            margin-bottom: 18px;
        }

        h1 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: clamp(65px, 10vw, 130px);
            line-height: .85;
            font-weight: 900;
            letter-spacing: -2px;
            text-transform: uppercase;
        }

        .hero-line {
            width: 55px;
            height: 3px;
            background: #ffffff;
            margin: 35px auto 0;
        }

        /* PROFILES */
        .profiles {
            width: 86%;
            max-width: 1250px;
            margin: 0 auto 100px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .profile {
            position: relative;
            min-height: 250px;
            background: #0b0b0b;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden;
            transition: transform .3s ease, border-color .3s ease;
        }

        .profile::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: #ffffff;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .3s ease;
        }

        .profile:hover {
            transform: translateY(-6px);
            border-color: rgba(255,255,255,0.25);
        }

        .profile:hover::before {
            transform: scaleX(1);
        }

        .number {
            position: absolute;
            top: 22px;
            right: 25px;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 55px;
            font-weight: 800;
            color: rgba(255,255,255,0.045);
        }

        .role {
            color: #8b8b8b;
            text-transform: uppercase;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .name {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 43px;
            font-weight: 800;
            text-transform: uppercase;
            line-height: .95;
        }

        .username {
            margin-top: 10px;
            color: #777;
            font-size: 13px;
            font-weight: 500;
        }

        /* FOOTER */
        footer {
            border-top: 1px solid rgba(255,255,255,0.08);
            padding: 30px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #555;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        @media (max-width: 850px) {
            .profiles {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            nav {
                padding: 22px 6%;
            }

            .hero {
                padding: 80px 6% 50px;
            }

            .profiles {
                width: 88%;
                grid-template-columns: 1fr;
            }

            .profile {
                min-height: 220px;
            }

            footer {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
        }
    </style>
</head>
